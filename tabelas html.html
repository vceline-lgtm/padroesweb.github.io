<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>
</head>

<body>
    <h2>Tabela 1 - NAME</h2>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>25</td>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Bruno</td>
            <td>30</td>
            <td>Rio de Janeiro</td>
        </tr>
        <tr>
            <td>Carla</td>
            <td>28</td>
            <td>Belo Horizonte</td>
        </tr>
    </table>


    <h2>Tabela 2 - NAME</h2>
    <table border="1">
        <th colspan="3">NAME</th>
        <tr>
            <td>Smartphone</td>
            <td>R$ 1500</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>R$ 2000</td>
        </tr>   
        <tr>
            <td>Notebook</td>
            <td>R$ 3000</td>
        </tr>
    </table>
    
    <h2>Tabela 3 - NAME</h2>
    <table border="1">     
        <th colspan="3">NAME</th>
        <tr>
            <td>Produto A</td>
            <td>R$ 100</td>
            <td>50</td>
        </tr>
        <tr>    
            <td>Produto B</td>
            <td>R$ 200</td>
        </tr>
    </table>  
</body>
</html>
